apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frontend
          # Only this one key, not `envFrom: app-secrets` — the frontend is the
          # public-facing pod and has no business holding the DB/MinIO/Keycloak
          # credentials that live in that Secret. vite.config.ts reads this at
          # dev-server start and inlines it into the bundle (unavoidable: the
          # Google 3D Tiles API is called from the browser), so restrict the key
          # by HTTP referrer in the Google Cloud console.
          env:
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: GOOGLE_API_KEY
                  optional: true
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - frontend.127.0.0.1.nip.io
      secretName: nip-tls
  rules:
    - host: frontend.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ts
  annotations:
    tailscale.com/hostname: "hidris-dt"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: frontend
      port:
        number: 80
  tls:
    - hosts:
        - hidris-dt
