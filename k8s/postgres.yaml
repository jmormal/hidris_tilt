# k8s/postgres.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hidris-db
spec:
  instances: 2
  # PostGIS + raster need an image that ships the extensions and GDAL.
  # Must match the existing cluster's major version (18) — CNPG forbids
  # major downgrades. The PostGIS images use a full tag; this is the
  # rolling "latest for PG18 / PostGIS 3.x" form.
  imageName: ghcr.io/cloudnative-pg/postgis:18-3.6-system-trixie
  # k3d uses the 'local-path' storage class by default
  storage:
    size: 5Gi
  managed:
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: hidris-db-ts
              annotations:
                tailscale.com/expose: "true"
                tailscale.com/hostname: "hidris-db"
  postgresql:
    parameters:
      # Allow ST_AsPNG / ST_ColorMap to use GDAL PNG driver inside SQL.
      postgis.gdal_enabled_drivers: "ENABLE_ALL"
      postgis.enable_outdb_rasters: "true"
      # raster tile work is binary-heavy; give queries room
      work_mem: "128MB"
      shared_buffers: "256MB"
      # Reap backends whose client vanished. An HPC job cancelled mid
      # get_storm_cube() leaves a backend blocked in lo_read writing to a dead
      # TCP peer; it holds its lock on `storms`, so the API's init_storms()
      # migration cannot take ACCESS EXCLUSIVE and every api pod then hangs
      # forever at "Waiting for application startup" — a failure that looks
      # nothing like its cause. Postgres defaults to the kernel's ~2h keepalive;
      # this detects the dead peer in about two minutes.
      tcp_keepalives_idle: "60"
      tcp_keepalives_interval: "10"
      tcp_keepalives_count: "6"
  bootstrap:
    initdb:
      database: hidris
      owner: hidris
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS postgis;
        - CREATE EXTENSION IF NOT EXISTS postgis_raster;
