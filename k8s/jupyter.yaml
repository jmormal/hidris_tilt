apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter
spec:
  selector:
    matchLabels:
      app: jupyter
  template:
    metadata:
      labels:
        app: jupyter
    spec:
      containers:
        - name: jupyter
          image: jupyter
          ports:
            - containerPort: 8888
          env:
            - name: API_URL
              value: "http://api:80"
          volumeMounts:
            - name: notebooks
              mountPath: /app/notebooks
      volumes:
        - name: notebooks
          hostPath:
            path: /mnt/notebooks
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: jupyter
spec:
  selector:
    app: jupyter
  ports:
    - port: 80
      targetPort: 8888
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jupyter
spec:
  ingressClassName: traefik
  rules:
    - host: jupyter.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jupyter
                port:
                  number: 80
---
# Tailnet ingress. The operator gives this a device of its own and a real
# Let's Encrypt cert for <name>.tail51f978.ts.net, so no mkcert CA and no
# /etc/hosts entry is needed to reach it from any tailnet member. The traefik
# ingress above stays as the local fallback for when the tailnet is unavailable.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jupyter-ts
  annotations:
    tailscale.com/hostname: "hidris-jupyter"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: jupyter
      port:
        number: 80
  tls:
    - hosts:
        - hidris-jupyter
