# k8s/keycloak.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: "admin"
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: "admin"
            # Tell Keycloak its public URL so issuer/redirects are correct.
            # This is the issuer baked into every token, so it must match
            # KC_PUBLIC_URL in config.env (which src/auth.py validates against).
            # KC_HOSTNAME_STRICT=false below means the nip.io ingress still
            # answers; it just issues tokens with this issuer either way.
            - name: KC_HOSTNAME
              value: "https://hidris-keycloak.tail51f978.ts.net"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
                          # --- CONFIGURACIÓN DE LA BASE DE DATOS POSTGRES ---
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              # "hidris-db-rw" es el servicio de escritura de CNPG
              value: "jdbc:postgresql://keycloak-db-rw.default.svc.cluster.local:5432/keycloak"
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-app
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-app
                  key: password
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - keycloak.127.0.0.1.nip.io
      secretName: nip-tls
  rules:
    - host: keycloak.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 80
---
# Tailnet ingress. The operator gives this a device of its own and a real
# Let's Encrypt cert for <name>.tail51f978.ts.net, so no mkcert CA and no
# /etc/hosts entry is needed to reach it from any tailnet member. The traefik
# ingress above stays as the local fallback for when the tailnet is unavailable.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-ts
  annotations:
    tailscale.com/hostname: "hidris-keycloak"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: keycloak
      port:
        number: 80
  tls:
    - hosts:
        - hidris-keycloak
